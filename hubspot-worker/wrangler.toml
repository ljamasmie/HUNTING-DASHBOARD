name = "hunting-dashboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Se rellena tras crear el namespace con:
#   wrangler kv namespace create SYNC_KV0
[[kv_namespaces]]
binding = "SYNC_KV"
id = "4e5127e365c5427b969e0b980d47e5ac"

[vars]
# Origen exacto de tu GitHub Pages. Sin barra final.
ALLOWED_ORIGIN = "https://ljamasmie.github.io"

# El token NO va aquí. Se sube como secret:
#   wrangler secret put HUBSPOT_TOKEN
